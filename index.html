<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근명고 탐험 맵</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0f0f1a; --accent:#7c3aed; --accent2:#06b6d4;
    --text:#e2e8f0; --muted:#64748b; --card:#1e1e35;
    --bakery:#f59e0b; --fashion:#ec4899; --media:#06b6d4; --marketing:#10b981;
  }
  body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  body::before {
    content:''; position:fixed; inset:0;
    background-image:linear-gradient(rgba(124,58,237,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,0.05) 1px,transparent 1px);
    background-size:32px 32px; pointer-events:none; z-index:0;
  }

  header { position:relative; z-index:1; text-align:center; padding:24px 20px 10px; }
  .eyebrow { font-size:10px; letter-spacing:4px; color:var(--accent2); text-transform:uppercase; margin-bottom:5px; }
  h1 { font-size:clamp(22px,5vw,40px); font-weight:900; background:linear-gradient(135deg,#fff 30%,var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  /* stamp bar */
  .stamp-bar {
    position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
    margin:12px auto; padding:10px 20px; background:var(--card);
    border:1px solid rgba(124,58,237,0.25); border-radius:50px; width:fit-content; max-width:92vw;
  }
  .stamp-item { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:9px; color:var(--muted); transition:color .3s; }
  .stamp-icon { width:30px; height:30px; border-radius:50%; border:2px dashed var(--muted); display:flex; align-items:center; justify-content:center; font-size:15px; filter:grayscale(1); transition:all .4s; }
  .stamp-item.collected .stamp-icon { border-color:var(--accent2); filter:none; box-shadow:0 0 10px rgba(6,182,212,.5); }
  .stamp-item.collected { color:var(--accent2); }
  .divider { width:1px; height:28px; background:rgba(255,255,255,.08); }
  .stamp-total { font-size:12px; color:var(--muted); white-space:nowrap; }
  .stamp-total span { color:var(--accent2); font-weight:700; }

  /* tabs */
  .tab-wrap { position:relative; z-index:1; display:flex; justify-content:center; gap:5px; margin:12px auto 0; padding:0 12px; flex-wrap:wrap; }
  .tab { padding:7px 16px; border-radius:50px; border:1px solid rgba(255,255,255,.08); font-family:'Noto Sans KR',sans-serif; font-size:12px; font-weight:700; cursor:pointer; background:var(--card); color:var(--muted); transition:all .2s; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* map area */
  .map-wrap { position:relative; z-index:1; max-width:860px; margin:16px auto 40px; padding:0 12px; }
  .floor-panel { display:none; }
  .floor-panel.active { display:block; }

  /* building SVG floor */
  .floor-svg-wrap { position:relative; width:100%; }
  .floor-svg-wrap svg { width:100%; height:auto; display:block; }

  /* room base styles in SVG handled inline */

  /* NPC pulse marker */
  .npc-marker {
    position:absolute; transform:translate(-50%,-50%);
    cursor:pointer; z-index:10; transition:transform .15s;
  }
  .npc-marker:hover { transform:translate(-50%,-50%) scale(1.15); }
  .npc-pulse {
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; position:relative; box-shadow:0 4px 16px rgba(0,0,0,.4);
    border:2px solid rgba(255,255,255,.2);
  }
  .npc-pulse::before {
    content:''; position:absolute; inset:-6px; border-radius:50%;
    border:2px solid; opacity:.5; animation:pulse 2s ease-in-out infinite;
  }
  .npc-label {
    position:absolute; bottom:-22px; left:50%; transform:translateX(-50%);
    white-space:nowrap; font-size:10px; font-weight:700; padding:2px 7px;
    border-radius:10px; background:rgba(0,0,0,.7); color:#fff;
  }
  .npc-marker.collected .npc-pulse::after {
    content:'✔'; position:absolute; top:-4px; right:-4px;
    background:#06b6d4; color:#000; width:16px; height:16px;
    border-radius:50%; font-size:9px; font-weight:900;
    display:flex; align-items:center; justify-content:center;
  }

  @keyframes pulse {
    0%,100% { transform:scale(1); opacity:.5; }
    50% { transform:scale(1.35); opacity:.1; }
  }

  /* legend */
  .legend {
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    margin:0 0 10px; padding:0 12px;
    position:relative; z-index:1;
  }
  .legend-item { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
  .legend-dot { width:10px; height:10px; border-radius:50%; }

  /* modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.82); backdrop-filter:blur(10px); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .3s; }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal { background:var(--card); border-radius:24px; padding:28px; max-width:380px; width:100%; position:relative; border:1px solid rgba(255,255,255,.1); transform:scale(.9) translateY(20px); transition:transform .3s; }
  .modal-overlay.open .modal { transform:scale(1) translateY(0); }
  .modal-bar { height:3px; border-radius:3px; margin-bottom:20px; }
  .modal-emoji { font-size:44px; margin-bottom:8px; }
  .modal-npc-label { font-size:10px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-bottom:3px; }
  .modal-npc-name { font-size:19px; font-weight:900; color:#fff; margin-bottom:6px; }
  .modal-location { font-size:11px; color:var(--muted); margin-bottom:12px; }
  .modal-dialog { background:rgba(255,255,255,.05); border-radius:10px; padding:13px; font-size:13px; line-height:1.7; color:var(--text); margin-bottom:14px; border-left:3px solid; }
  .modal-mission-label { font-size:10px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:5px; }
  .modal-mission { font-size:14px; font-weight:700; color:#fff; margin-bottom:18px; }
  .modal-btn { width:100%; padding:12px; border-radius:10px; border:none; font-size:14px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif; transition:opacity .2s; }
  .modal-btn:hover { opacity:.85; }
  .modal-close { position:absolute; top:13px; right:13px; background:rgba(255,255,255,.08); border:none; color:var(--muted); width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .modal-close:hover { background:rgba(255,255,255,.15); color:#fff; }

  /* toast */
  .stamp-toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); padding:12px 24px; border-radius:50px; font-weight:700; font-size:13px; z-index:300; transition:transform .5s cubic-bezier(.34,1.56,.64,1); white-space:nowrap; box-shadow:0 6px 24px rgba(0,0,0,.4); }
  .stamp-toast.show { transform:translateX(-50%) translateY(0); }
  .complete-banner { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(120px); background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; padding:13px 26px; border-radius:50px; font-weight:700; font-size:14px; z-index:200; transition:transform .5s cubic-bezier(.34,1.56,.64,1); white-space:nowrap; box-shadow:0 8px 28px rgba(124,58,237,.5); }
  .complete-banner.show { transform:translateX(-50%) translateY(0); }
</style>
</head>

<script>
const zones = {
  bakery:    { emoji:'🍞', name:'카페사장 민지', dept:'베이커리카페과', color:'#f59e0b', floor:1, location:'📍 1층 식생활 교육관', dialog:'"저 중학교 때 그냥 카페 알바나 할까 생각했거든요. 근데 여기 와서 레시피 개발하고 원가 계산 배우니까... 졸업하고 바로 카페 브랜드 취업했어요 😄"', mission:'음료 한 잔 직접 만들어보기', password:'1111' },
  fashion:   { emoji:'👗', name:'디자이너 수빈', dept:'패션산업디자인과', color:'#ec4899', floor:4, location:'📍 4층 진로진학 상담실', dialog:'"나이키 매장 취업했을 때 중학교 친구들이 제일 놀랐어요. 걔네 아직 대학 다니는데 저는 이미 2년차 직원이거든요. 이 옷 제가 직접 만든 거예요!"', mission:'선배 작품 비하인드 스토리 듣기', password:'1111' },
  media:     { emoji:'💻', name:'개발자 현우', dept:'미디어소프트웨어과', color:'#06b6d4', floor:2, location:'📍 2층 다목적실', dialog:'"병역특례로 IT 회사 다니고 있어요. 정보처리산업기사 스펙 넣었더니 면접관이 엄청 신기해했어요. 영상 편집 10분만 같이 해볼래요?"', mission:'영상 편집 or 코딩 10분 체험', password:'1111' },
  marketing: { emoji:'📊', name:'마케터 지호', dept:'마케팅경영과', color:'#10b981', floor:3, location:'📍 3층 과학실2', dialog:'"공기업 합격했을 때 담임 선생님한테 제일 먼저 전화했어요. 저 연봉 맞혀보실래요? 맞히면 취업 꿀팁 다 드림 😂"', mission:'선배 연봉 맞히기 도전 (힌트 3개)', password:'1111' }
};

const collected = new Set(JSON.parse(sessionStorage.getItem('stamps')||'[]'));
let current = null;

function init() {
  collected.forEach(k => applyStamp(k, false));
  const params = new URLSearchParams(location.search);
  const stamp = params.get('stamp');
  if (stamp && zones[stamp] && !collected.has(stamp)) {
    collectStamp(stamp);
    history.replaceState({}, '', location.pathname);
  } else if (stamp && collected.has(stamp)) {
    showToast('⚡ 이미 받은 스탬프예요!', '#334155', '#94a3b8');
    history.replaceState({}, '', location.pathname);
  }
}

function showFloor(n, btn) {
  document.querySelectorAll('.floor-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('floor-' + n).classList.add('active');
  btn.classList.add('active');
}

function openModal(key) {
  const z = zones[key]; current = key;
  document.getElementById('modal-emoji').textContent = z.emoji;
  document.getElementById('modal-name').textContent = z.name + ' · ' + z.dept;
  document.getElementById('modal-location').textContent = z.location;
  document.getElementById('modal-bar').style.background = z.color;
  const d = document.getElementById('modal-dialog');
  d.textContent = z.dialog; d.style.borderColor = z.color;
  document.getElementById('modal-mission').textContent = z.mission;
  document.getElementById('pw-btn').style.background = z.color;

  const done = collected.has(key);
  document.getElementById('pw-done').style.display = done ? 'block' : 'none';
  document.getElementById('pw-area').style.display = done ? 'none' : 'block';
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-error').style.display = 'none';

  document.getElementById('modal-overlay').classList.add('open');
  if (!done) setTimeout(() => document.getElementById('pw-input').focus(), 300);
}

function closeModal(e) { if (e.target === document.getElementById('modal-overlay')) closeModalBtn(); }
function closeModalBtn() { document.getElementById('modal-overlay').classList.remove('open'); }

function clearPwError() { document.getElementById('pw-error').style.display = 'none'; }

function submitPw() {
  if (!current || collected.has(current)) return;
  const val = document.getElementById('pw-input').value.trim();
  const z = zones[current];
  if (val === z.password) {
    collectStamp(current);
    document.getElementById('pw-done').style.display = 'block';
    document.getElementById('pw-area').style.display = 'none';
  } else {
    const err = document.getElementById('pw-error');
    err.style.display = 'block';
    const input = document.getElementById('pw-input');
    input.style.borderColor = '#ef4444';
    input.value = '';
    setTimeout(() => { input.style.borderColor = 'rgba(255,255,255,.15)'; }, 1000);
  }
}

function collectStamp(key) {
  const k = key || current;
  if (!k || collected.has(k)) return;
  collected.add(k); current = k;
  sessionStorage.setItem('stamps', JSON.stringify([...collected]));
  applyStamp(k, true);
  if (collected.size === 4) setTimeout(() => document.getElementById('complete-banner').classList.add('show'), 800);
}

function applyStamp(key, animate) {
  const z = zones[key];
  document.getElementById('s-' + key).classList.add('collected');
  document.getElementById('count').textContent = collected.size;
  const npc = document.getElementById('npc-' + key);
  if (npc) npc.classList.add('collected');
  if (animate) {
    const tabs = document.querySelectorAll('.tab');
    const fm = {5:0,4:1,3:2,2:3,1:4};
    showFloor(z.floor, tabs[fm[z.floor]]);
    showToast(z.emoji + ' ' + z.dept + ' 스탬프 획득!', z.color, '#000');
  }
}

function showToast(msg, bg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = bg; t.style.color = color;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

init();
</script>
</body>
</html>
